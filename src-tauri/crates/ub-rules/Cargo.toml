[package]
name = "ub-rules"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
chrono-tz = "0.10"
# Only to check that `Query::to_fts5` output is valid FTS5 syntax.
rusqlite = { version = "0.40", features = ["bundled", "functions"] }

[lints]
workspace = true
