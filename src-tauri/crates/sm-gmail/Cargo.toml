[package]
name = "sm-gmail"
version = "0.1.0"
description = "The Gmail API client: OAuth, quota scheduling, typed outcomes"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
sm-domain = { path = "../sm-domain" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query", "form"] }
oauth2 = { version = "5", default-features = false }
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
rand = "0.9"
base64 = "0.22"
percent-encoding = "2"
url = "2"
parking_lot = "0.12"

[dev-dependencies]
sm-fake-gmail = { path = "../sm-fake-gmail" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }

[lints]
workspace = true
