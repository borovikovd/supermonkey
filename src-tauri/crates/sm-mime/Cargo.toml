[package]
name = "sm-mime"
version = "0.1.0"
description = "Mail formats: parse Gmail payloads, sanitize HTML, build outgoing MIME"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
sm-domain = { path = "../sm-domain" }
ammonia = "4"
mail-builder = "2"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
encoding_rs = "0.8"
html-escape = "0.3"
percent-encoding = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[lints]
workspace = true
