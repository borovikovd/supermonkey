[package]
name = "ub-testkit"
version = "0.1.0"
description = "Test and demo support: the /__test control server, demo mode, and the perf fixture"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
ub-core = { path = "../ub-core" }
ub-bridge = { path = "../ub-bridge", features = ["web"] }
ub-domain = { path = "../ub-domain" }
ub-gmail = { path = "../ub-gmail" }
ub-store = { path = "../ub-store" }
ub-fake-gmail = { path = "../ub-fake-gmail" }
anyhow = "1"
axum = "0.8"
base64 = "0.22"
parking_lot = "0.12"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "fs"] }
tracing = "0.1"
url = "2"

[lints]
workspace = true
