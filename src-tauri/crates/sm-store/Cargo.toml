[package]
name = "sm-store"
version = "0.1.0"
description = "SQLite storage: the writer actor, the read pool, and typed repositories"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
sm-domain = { path = "../sm-domain", features = ["sqlite"] }
parking_lot = "0.12"
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[features]
# Test-only hooks for other crates' tests (a commit that fails on purpose).
test-hooks = []

[lints]
workspace = true
