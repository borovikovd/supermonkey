[package]
name = "sm-testkit"
version = "0.1.0"
description = "Test and demo support: the /__test control server, demo mode, and the perf fixture"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
sm-core = { path = "../sm-core" }
sm-bridge = { path = "../sm-bridge", features = ["web"] }
sm-domain = { path = "../sm-domain" }
sm-ipc = { path = "../sm-ipc" }
sm-gmail = { path = "../sm-gmail" }
sm-store = { path = "../sm-store" }
sm-fake-gmail = { path = "../sm-fake-gmail" }
anyhow = "1"
axum = "0.8"
base64 = "0.22"
parking_lot = "0.12"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "fs", "signal"] }
tracing = "0.1"
url = "2"

[lints]
workspace = true
