[package]
name = "ub-mime"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ammonia = "4"
mail-builder = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
html-escape = "0.3"
regex = "1"
encoding_rs = "0.8"

[dev-dependencies]
mail-parser = "1"

[lints]
workspace = true
