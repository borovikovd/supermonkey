[package]
name = "ubermensch"
version = "0.1.1"
description = "A keyboard-first Gmail client for macOS"
edition.workspace = true
rust-version.workspace = true
default-run = "ubermensch"

[lib]
name = "ubermensch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ubermensch"
path = "src/main.rs"

[[bin]]
name = "e2e-server"
path = "src/bin/e2e_server.rs"
required-features = ["fake"]

# Dev tools sit behind `fake` so the bundler leaves them out of the app.
[[bin]]
name = "perf-fixture"
path = "src/bin/perf_fixture.rs"
required-features = ["fake"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2.12", features = ["macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12", features = ["serde-json-impl"] }
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
crossbeam-channel = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query", "form"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
log = "0.4"
rand = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
html-escape = "0.3"
parking_lot = "0.12"
axum = "0.8"
tokio-stream = "0.1"
futures-util = "0.3"
ub-mime = { path = "crates/ub-mime" }
ub-gmail = { path = "crates/ub-gmail" }
ub-rules = { path = "crates/ub-rules" }
ub-fake-gmail = { path = "crates/ub-fake-gmail", optional = true }
tempfile = { version = "3", optional = true }

[features]
# Debug only: run against an in-process fake Gmail with demo mail (UBERMENSCH_FAKE=1).
fake = ["dep:ub-fake-gmail", "dep:tempfile"]

[dev-dependencies]
proptest = "1"
tempfile = "3"
ub-fake-gmail = { path = "crates/ub-fake-gmail" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }

[lints]
workspace = true

[workspace.package]
# An application, not a library: its minimum Rust is the pinned toolchain.
edition = "2024"
rust-version = "1.99"

[workspace]
members = [".", "crates/ub-mime", "crates/ub-gmail", "crates/ub-fake-gmail", "crates/ub-rules"]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.rustdoc]
# Doc warnings fail `cargo doc` (the `lint:rust` task).
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
invalid_rust_codeblocks = "deny"
bare_urls = "deny"
redundant_explicit_links = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that do not fit an application crate:
# - `#[must_use]` on every getter adds noise; real must-use types are marked;
must_use_candidate = "allow"
# - errors are anyhow chains with context, and nothing here is a published API;
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# - every hash map and set uses the default hasher; generic hashers would only add type noise.
implicit_hasher = "allow"
# Restriction lints worth having in production code.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
# Exceptions are `#[expect(lint, reason = "...")]`, so a stale one is reported.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# A guard held through a `match` or `if let` body is a deadlock waiting to happen.
significant_drop_in_scrutinee = "warn"
# Keep the cause when mapping errors.
map_err_ignore = "warn"
# Numeric conversions are explicit (`From` / `try_from`), never `as`.
as_conversions = "warn"
# Panics only in tests (clippy.toml allows them there).
expect_used = "warn"
unwrap_in_result = "warn"
# An Arc clone reads as `Arc::clone(&x)`, never like a deep copy.
clone_on_ref_ptr = "warn"
needless_pass_by_ref_mut = "warn"
