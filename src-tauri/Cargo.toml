[package]
name = "ubermensch"
version = "0.1.0"
description = "A keyboard-first Gmail client for macOS"
edition = "2024"
rust-version = "1.90"
default-run = "ubermensch"

[lib]
name = "ubermensch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ubermensch"
path = "src/main.rs"

[[bin]]
name = "perf-fixture"
path = "src/bin/perf_fixture.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2.12", features = ["macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12", features = ["serde-json-impl"] }
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
crossbeam-channel = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query", "form"] }
oauth2 = { version = "5", default-features = false }
keyring = "4"
ammonia = "4"
mail-builder = "2"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
anyhow = "1"
log = "0.4"
rand = "0.9"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
html-escape = "0.3"
regex = "1"
parking_lot = "0.12"
axum = "0.8"
tokio-stream = "0.1"
futures-util = "0.3"
ub-mime = { path = "crates/ub-mime" }
ub-gmail = { path = "crates/ub-gmail" }
ub-rules = { path = "crates/ub-rules" }
ub-fake-gmail = { path = "crates/ub-fake-gmail", optional = true }

[features]
# Debug only: run against an in-process fake Gmail with demo mail (UBERMENSCH_FAKE=1).
fake = ["dep:ub-fake-gmail"]

[dev-dependencies]
proptest = "1"
tempfile = "3"
ub-fake-gmail = { path = "crates/ub-fake-gmail" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }

[lints]
workspace = true

[workspace]
members = [".", "crates/ub-mime", "crates/ub-gmail", "crates/ub-fake-gmail", "crates/ub-rules"]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that only add noise here.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
implicit_hasher = "allow"
# Owned arguments move into spawned tasks, writer jobs, and builders.
needless_pass_by_value = "allow"
# SQLite stores i64; ids, counts, and millisecond times convert freely.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
# Restriction lints worth having in production code.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
print_stdout = "warn"
