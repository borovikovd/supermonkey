[package]
name = "supermonkey"
version = "0.7.2"
description = "A keyboard-first Gmail client for macOS"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "supermonkey"

[lib]
name = "supermonkey_lib"
crate-type = ["rlib"]

[[bin]]
name = "supermonkey"
path = "src/main.rs"

[[bin]]
name = "e2e-server"
path = "src/bin/e2e_server.rs"
required-features = ["fake"]

[[bin]]
name = "perf-fixture"
path = "src/bin/perf_fixture.rs"
required-features = ["fake"]

[[test]]
name = "menu"
harness = false

[[test]]
name = "engine"
required-features = ["fake"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
ammonia = "4"
axum = { version = "0.8", optional = true }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
encoding_rs = "0.8"
futures-core = { version = "0.3", optional = true }
futures-util = { version = "0.3", optional = true }
html-escape = "0.3"
html5ever = "0.40"
mail-builder = "2"
parking_lot = "0.12"
percent-encoding = "2"
rand = "0.9"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "query", "rustls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sm-fake-gmail = { path = "crates/sm-fake-gmail", optional = true }
tauri = { version = "2.12", features = ["macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tempfile = { version = "3", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = "0.3"
ts-rs = "12"
url = "2"
uuid = { version = "1", features = ["v4"] }
xattr = "1"

[dev-dependencies]
chrono-tz = "0.10"
proptest = "1"
sm-fake-gmail = { path = "crates/sm-fake-gmail" }
tauri = { version = "2.12", features = ["macos-private-api", "test"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[features]
web = ["dep:axum", "dep:futures-core", "dep:futures-util"]
fake = ["web", "dep:sm-fake-gmail", "dep:tempfile"]

[lints]
workspace = true

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace]
members = [
    ".",
    "crates/sm-fake-gmail",
]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_qualifications = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unnameable_types = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
rust_2024_incompatible_pat = "warn"
elided_lifetimes_in_paths = "warn"
explicit_outlives_requirements = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_extern_crates = "warn"
unused_lifetimes = "warn"
single_use_lifetimes = "warn"

[workspace.lints.rustdoc]
all = { level = "warn", priority = -1 }
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
invalid_rust_codeblocks = "deny"
bare_urls = "deny"
redundant_explicit_links = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
implicit_hasher = "allow"

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unwrap_in_result = "warn"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
exit = "warn"
mem_forget = "warn"

let_underscore_must_use = "warn"
must_use_candidate = "warn"
map_err_ignore = "warn"
wildcard_enum_match_arm = "warn"
rest_pat_in_fully_bound_structs = "warn"

allow_attributes = "warn"
allow_attributes_without_reason = "warn"
missing_assert_message = "warn"

clone_on_ref_ptr = "warn"
redundant_clone = "warn"
redundant_allocation = "warn"
large_futures = "warn"
needless_pass_by_ref_mut = "warn"
needless_collect = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
str_to_string = "warn"
unnecessary_struct_initialization = "warn"
future_not_send = "warn"

significant_drop_in_scrutinee = "warn"
await_holding_lock = "warn"
mutex_atomic = "warn"
mutex_integer = "warn"

as_conversions = "warn"
lossy_float_literal = "warn"
imprecise_flops = "warn"
suboptimal_flops = "warn"
unused_rounding = "warn"
while_float = "warn"

print_stdout = "warn"
print_stderr = "warn"

branches_sharing_code = "warn"
cognitive_complexity = "warn"
clear_with_drain = "warn"
collection_is_never_read = "warn"
create_dir = "warn"
deref_by_slicing = "warn"
derive_partial_eq_without_eq = "warn"
empty_drop = "warn"
equatable_if_let = "warn"
if_then_some_else_none = "warn"
iter_on_empty_collections = "warn"
iter_on_single_items = "warn"
iter_with_drain = "warn"
large_stack_frames = "warn"
missing_const_for_fn = "warn"
nonstandard_macro_braces = "warn"
or_fun_call = "warn"
path_buf_push_overwrite = "warn"
read_zero_byte_vec = "warn"
shadow_same = "warn"
string_lit_as_bytes = "warn"
string_lit_chars_any = "warn"
suspicious_operation_groupings = "warn"
trailing_empty_array = "warn"
trait_duplication_in_bounds = "warn"
transmute_undefined_repr = "warn"
trivial_regex = "warn"
tuple_array_conversions = "warn"
type_repetition_in_bounds = "warn"
uninhabited_references = "warn"
unnecessary_self_imports = "warn"
unused_peekable = "warn"
use_self = "warn"
useless_let_if_seq = "warn"
verbose_file_reads = "warn"
