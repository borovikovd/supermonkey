[package]
name = "supermonkey"
version = "0.7.0"
description = "A keyboard-first Gmail client for macOS"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "supermonkey"

[lib]
name = "supermonkey_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "supermonkey"
path = "src/main.rs"

[[bin]]
name = "e2e-server"
path = "src/bin/e2e_server.rs"
required-features = ["fake"]

[[bin]]
name = "perf-fixture"
path = "src/bin/perf_fixture.rs"
required-features = ["fake"]

# macOS makes menus only on the main thread, where a test runs only
# without the harness.
[[test]]
name = "menu"
harness = false

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
sm-core = { path = "crates/sm-core" }
sm-bridge = { path = "crates/sm-bridge" }
sm-ipc = { path = "crates/sm-ipc" }
sm-domain = { path = "crates/sm-domain" }
sm-gmail = { path = "crates/sm-gmail" }
sm-testkit = { path = "crates/sm-testkit", optional = true }
tauri = { version = "2.12", features = ["macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
# `tauri::test`: a mock app to build the menu bar on (tests/menu.rs).
tauri = { version = "2.12", features = ["macos-private-api", "test"] }

[features]
# Debug only: the web bridge on 127.0.0.1:1430 (SUPERMONKEY_WEB_BRIDGE=1), for
# the UI in a browser. Release builds leave it off.
web = ["sm-bridge/web"]
# Debug only: the E2E server (`e2e-server`), demo mode (SUPERMONKEY_FAKE=1),
# against an in-process fake Gmail, and the perf fixture (`perf-fixture`).
fake = ["web", "dep:sm-testkit", "tokio/rt-multi-thread", "tokio/macros"]

[lints]
workspace = true

[workspace.package]
# An application, not a library: its minimum Rust is the pinned toolchain.
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace]
members = [
    ".",
    "crates/sm-domain",
    "crates/sm-mime",
    "crates/sm-gmail",
    "crates/sm-store",
    "crates/sm-core",
    "crates/sm-ipc",
    "crates/sm-bridge",
    "crates/sm-testkit",
    "crates/sm-fake-gmail",
]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_qualifications = "warn"
# Every type can be printed while debugging, and every item says what it is.
missing_debug_implementations = "warn"
missing_docs = "warn"
# `pub` means exported: an item only the crate uses is `pub(crate)`.
unreachable_pub = "warn"
unnameable_types = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
rust_2024_incompatible_pat = "warn"
elided_lifetimes_in_paths = "warn"
explicit_outlives_requirements = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_extern_crates = "warn"
unused_lifetimes = "warn"

[workspace.lints.rustdoc]
all = { level = "warn", priority = -1 }
# Doc warnings fail `cargo doc` (the `lint:rust` task).
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
invalid_rust_codeblocks = "deny"
bare_urls = "deny"
redundant_explicit_links = "deny"

# The groups, then single lints on top. The single lints and the thresholds in
# clippy.toml follow github.com/deltartificial/vulcan, merged with what was here:
# nothing that was on is off. A vulcan lint left off says why, with its count on
# this workspace when it was tried (2026-11-10).
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that do not fit an application crate:
# - errors are typed per crate and documented on the enum, and nothing here is a published API;
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# - every hash map and set uses the default hasher; generic hashers would only add type noise.
implicit_hasher = "allow"

# No panics outside tests (clippy.toml allows them there).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unwrap_in_result = "warn"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# The process ends through the app's quit path, and nothing is leaked on purpose.
exit = "warn"
mem_forget = "warn"

# Nothing is dropped silently.
let_underscore_must_use = "warn"
must_use_candidate = "warn"
# Keep the cause when mapping errors.
map_err_ignore = "warn"
# A match on an enum names its variants, so a new one is a compile error, not a
# silent fall into `_`.
wildcard_enum_match_arm = "warn"
rest_pat_in_fully_bound_structs = "warn"

# Exceptions are `#[expect(lint, reason = "...")]`, so a stale one is reported.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
missing_assert_message = "warn"

# Ownership (AGENTS.md).
# An Arc clone reads as `Arc::clone(&x)`, never like a deep copy.
clone_on_ref_ptr = "warn"
# A clone of a value never used again is a move.
redundant_clone = "warn"
needless_pass_by_ref_mut = "warn"
rc_buffer = "warn"
str_to_string = "warn"
unnecessary_struct_initialization = "warn"

# Locks.
# A guard held through a `match` or `if let` body is a deadlock waiting to happen.
significant_drop_in_scrutinee = "warn"
await_holding_lock = "warn"
mutex_integer = "warn"

# Numbers.
# Numeric conversions are explicit (`From` / `try_from`), never `as`.
as_conversions = "warn"
lossy_float_literal = "warn"
imprecise_flops = "warn"
suboptimal_flops = "warn"
unused_rounding = "warn"
while_float = "warn"

# Output goes through `tracing`.
print_stdout = "warn"
print_stderr = "warn"

# Plain code.
branches_sharing_code = "warn"
# The threshold is clippy's 25 (clippy.toml), not vulcan's 15.
cognitive_complexity = "warn"
clear_with_drain = "warn"
collection_is_never_read = "warn"
create_dir = "warn"
deref_by_slicing = "warn"
derive_partial_eq_without_eq = "warn"
empty_drop = "warn"
equatable_if_let = "warn"
if_then_some_else_none = "warn"
iter_on_empty_collections = "warn"
iter_on_single_items = "warn"
iter_with_drain = "warn"
large_stack_frames = "warn"
missing_const_for_fn = "warn"
nonstandard_macro_braces = "warn"
or_fun_call = "warn"
path_buf_push_overwrite = "warn"
read_zero_byte_vec = "warn"
shadow_same = "warn"
string_lit_as_bytes = "warn"
string_lit_chars_any = "warn"
suspicious_operation_groupings = "warn"
trailing_empty_array = "warn"
trait_duplication_in_bounds = "warn"
transmute_undefined_repr = "warn"
trivial_regex = "warn"
tuple_array_conversions = "warn"
type_repetition_in_bounds = "warn"
uninhabited_references = "warn"
unnecessary_self_imports = "warn"
unused_peekable = "warn"
use_self = "warn"
useless_let_if_seq = "warn"
verbose_file_reads = "warn"

# vulcan lints left off:
# - shadow_reuse: 188 hits, 12 sampled, all a value refined under its own name
#   (`let subject = subject.trim()`, `let Some(row) = row else`). A second name
#   would leave the stale value in scope to be used by mistake.
# - tests_outside_test_module: 53 hits, all in integration test crates
#   (`crates/*/tests`, `tests/`), which only ever build as tests.
# - the lints vulcan allows (len_without_is_empty, wrong_self_convention,
#   result_large_err, needless_collect, manual_unwrap_or, and so on) stay on:
#   this workspace passes them.

