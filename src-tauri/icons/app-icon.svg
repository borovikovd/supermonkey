<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34275a"/>
      <stop offset="1" stop-color="#0d0a17"/>
    </linearGradient>
    <radialGradient id="dawn" cx="512" cy="860" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff9f5a" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#b8487e" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#714cb6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
