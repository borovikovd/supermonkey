# Releases. On every push to main, release-please keeps a "release X.Y.Z" pull
# request up to date: it bumps the version and writes CHANGELOG.md from the
# Conventional Commit subjects. Merging that pull request creates a draft
# release and its tag; this workflow then builds the macOS app, attaches the
# .dmg, and publishes the release.
#
# Run it by hand (Actions → Release → Run workflow) for a dry run: it builds the
# .dmg and keeps it as a workflow artifact, without releasing anything.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-macos:
    needs: release-please
    # `always()` lets a manual dry run go ahead although release-please was skipped.
    if: always() && (needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true

      # rustup is on the runner; the toolchain itself comes from src-tauri/rust-toolchain.toml.
      - name: Add both macOS targets
        working-directory: src-tauri
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      # build.rs bakes the Desktop OAuth client into release builds.
      - name: Write the OAuth client
        env:
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
        run: printf '%s' "$GOOGLE_OAUTH_CLIENT_JSON" > "$RUNNER_TEMP/google-oauth-client.json"

      # Unsigned (ad-hoc) for now. To sign and notarize, add APPLE_CERTIFICATE,
      # APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID,
      # APPLE_PASSWORD and APPLE_TEAM_ID secrets and pass them here as env.
      - name: Build the universal app
        env:
          UBERMENSCH_OAUTH_CLIENT: ${{ runner.temp }}/google-oauth-client.json
        run: vp run tauri build --target universal-apple-darwin --bundles dmg

      - name: Attach the .dmg to the draft release
        if: needs.release-please.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        # GitHub's release API sometimes answers 5xx; both calls are safe to repeat.
        run: |
          for try in 1 2 3; do
            gh release upload "$TAG" src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg --clobber && exit 0
            sleep 15
          done
          exit 1

      - name: Keep the .dmg (dry run)
        if: needs.release-please.outputs.created != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Ubermensch-macos
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  publish:
    needs: [release-please, build-macos]
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Add install notes and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          {
            echo '## Install'
            echo
            echo 'Download the `.dmg` below (Apple Silicon and Intel), open it, and drag Ubermensch to Applications.'
            echo 'The app is not signed yet, so macOS calls it damaged until you clear the download flag once:'
            echo
            echo '```sh'
            echo 'xattr -cr /Applications/Ubermensch.app'
            echo '```'
            echo
            echo "Google sign-in works for the app's test users only while its consent screen is in Testing."
            echo
            gh release view "$TAG" --json body --jq .body
          } > notes.md
          for try in 1 2 3; do
            gh release edit "$TAG" --notes-file notes.md --draft=false && exit 0
            sleep 15
          done
          exit 1
